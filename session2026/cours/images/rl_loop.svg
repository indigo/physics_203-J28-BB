<?xml version="1.0" encoding="UTF-8"?>
<svg width="820" height="390" viewBox="0 0 820 390" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
<defs><marker id="arrB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2b6cb0"/></marker><marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c53030"/></marker><marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f855a"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dd6b20"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7a8a9a"/></marker></defs>
<rect width="820" height="390" fill="white"/>
<text x="410.0" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">La boucle du Reinforcement Learning</text>
<rect x="40" y="110" width="250" height="150" rx="10" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="1.6"/>
<text x="165.0" y="142.0" text-anchor="middle" font-size="14" fill="#2b6cb0" font-weight="bold" font-style="normal">AGENT</text>
<text x="165.0" y="176.0" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" font-style="normal">Politique π</text>
<text x="165.0" y="204.0" text-anchor="middle" font-size="11" fill="#555" font-weight="normal" font-style="normal">réseau, règles ou table Q</text>
<text x="165.0" y="240.0" text-anchor="middle" font-size="12" fill="#555" font-weight="normal" font-style="italic">décide</text>
<rect x="530" y="110" width="250" height="150" rx="10" fill="#f0fff4" stroke="#2f855a" stroke-width="1.6"/>
<text x="655.0" y="142.0" text-anchor="middle" font-size="14" fill="#2f855a" font-weight="bold" font-style="normal">ENVIRONNEMENT</text>
<text x="655.0" y="176.0" text-anchor="middle" font-size="16" fill="#333" font-weight="bold" font-style="normal">Moteur physique</text>
<text x="655.0" y="204.0" text-anchor="middle" font-size="11" fill="#555" font-weight="normal" font-style="normal">forces → intégration → contacts</text>
<text x="655.0" y="240.0" text-anchor="middle" font-size="12" fill="#555" font-weight="normal" font-style="italic">calcule les conséquences</text>
<path d="M 290 140 C 380 60, 440 60, 526 140" fill="none" stroke="#2b6cb0" stroke-width="3" marker-end="url(#arrB)"/>
<text x="410.0" y="70.0" text-anchor="middle" font-size="14" fill="#2b6cb0" font-weight="bold" font-style="normal">action a<tspan font-size="9" dy="3">t</tspan></text>
<text x="410.0" y="88.0" text-anchor="middle" font-size="11" fill="#555" font-weight="normal" font-style="normal">couple, braquage, force</text>
<path d="M 530 228 C 440 300, 380 300, 294 228" fill="none" stroke="#2f855a" stroke-width="3" marker-end="url(#arrG)"/>
<text x="410.0" y="302.0" text-anchor="middle" font-size="13" fill="#2f855a" font-weight="bold" font-style="normal">observation o<tspan font-size="9" dy="3">t+1</tspan> (capteurs)</text>
<path d="M 530 250 C 440 352, 380 352, 294 250" fill="none" stroke="#dd6b20" stroke-width="3" marker-end="url(#arrO)"/>
<text x="410.0" y="350.0" text-anchor="middle" font-size="13" fill="#dd6b20" font-weight="bold" font-style="normal">récompense r<tspan font-size="9" dy="3">t</tspan> (note scalaire)</text>
<text x="410.0" y="372.0" text-anchor="middle" font-size="11" fill="#555" font-weight="normal" font-style="italic">L'agent ne voit jamais l'état complet : seulement ce que les capteurs mesurent.</text>
</svg>
